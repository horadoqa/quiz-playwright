name: Testes Automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  testes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Executar testes
        run: npx playwright test

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright/playwright-report
          retention-days: 15

      - name: Publicar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: Playwright/test-results
          retention-days: 15

      - name: Preparar site para o GitHub Pages
        working-directory: .
        run: |
          mkdir -p pages
          cp game/index.html pages/index.html
          cp -r game/assets pages/

      - name: Enviar site para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  publicar:
    needs: testes
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
